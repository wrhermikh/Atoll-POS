function findCode(c){
  c=String(c).trim().toLowerCase();if(!c)return null;
  const eq=x=>x&&String(x).toLowerCase()===c;
  for(const p of S.products){
    const vs=p.variants||[];
    for(let vi=0;vi<vs.length;vi++){const v=vs[vi],ss=v.subs||[];
      for(let si=0;si<ss.length;si++)if(eq(ss[si].barcode)||eq(ss[si].sku))return{p,vi,si};
      if(eq(v.barcode)||eq(v.sku))return{p,vi}}
    if(eq(p.barcode)||eq(p.sku))return{p};const ks=p.packs||[];for(let pi=0;pi<ks.length;pi++)if(eq(ks[pi].barcode)||eq(ks[pi].sku))return{p,pi}}
  return null;
}

async function camScan(){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Camera scanning is not supported in this browser. Use a barcode scanner or type the code.',1);return}

  const v=$('#cv');v.srcObject=stream;await v.play();
  const det=new BarcodeDetector();let on=true;
  const stop=()=>{on=false;stream.getTracks().forEach(t=>t.stop());$('#m').innerHTML=''};
  $('#cx').onclick=stop;
  const loop=async()=>{if(!on)return;try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;stop();scan(c);return}}catch(e){}setTimeout(loop,250)};loop();
}

async function pullRecords(){
  const rows=[];let from=0;
  for(;;){
    const r=await sbc.from('records').select('kind,rid,data,updated_at').eq('shop_id',cl.shop).order('kind').order('rid').range(from,from+999);
    if(r.error)throw r.error;rows.push(...r.data);if(r.data.length<1000)break;from+=1000;
  }
  const by={};rows.forEach(r=>{(by[r.kind]=by[r.kind]||[]).push(r);if(r.updated_at>cl.lastSync)cl.lastSync=r.updated_at});
  Object.keys(KINDS).forEach(k=>{
    const K=KINDS[k],arr=(by[k]||[]).map(r=>r.data).sort(K.sort);K.set(arr);
    const sn=cl.snap[k]={};arr.forEach(r=>{sn[K.id(r)]=cj(r)});
  });
}

async function pullDelta(){

  try{
    const r=await sbc.from('records').select('kind,rid,data,updated_at').eq('shop_id',cl.shop).gte('updated_at',cl.lastSync||'1970-01-01').order('updated_at').limit(1000);
    if(r.error)return;let ch=false;
    r.data.forEach(x=>{if(applyRec(x.kind,x.rid,x.data,false))ch=true;if(x.updated_at>cl.lastSync)cl.lastSync=x.updated_at});
    if(ch)softRender();
  }catch(e){}
}
function applyRec(kind,rid,data,del){
  const K=KINDS[kind];if(!K)return false;
  const sn=cl.snap[kind]||(cl.snap[kind]={});
  if(!del&&sn[rid]===cj(data))return false;
  const arr=K.get().slice(),i=arr.findIndex(r=>K.id(r)===rid);
  if(del){if(i<0)return false;arr.splice(i,1);delete sn[rid]}
  else{if(i>=0)arr[i]=data;else arr.push(data);sn[rid]=cj(data)}
  arr.sort(K.sort);K.set(arr);return true;
}

/* ---------- saving data ---------- */
async function cloudPush(retry){
  if(!cl.shop||!me)return;
  if(cl.busy){cl.again=true;return}
  cl.busy=true;pill('saving');
  try{
    for(const kind of Object.keys(KINDS)){
      const K=KINDS[kind],cur=new Map();K.get().forEach(r=>cur.set(K.id(r),r));
      const sn=cl.snap[kind]||(cl.snap[kind]={}),up=[],del=[];
      cur.forEach((r,id)=>{const c=cj(r);if(sn[id]!==c)up.push({rid:id,data:r,c})});
      if(kind!=='log')Object.keys(sn).forEach(id=>{if(!cur.has(id))del.push(id)});
      for(let i=0;i<up.length;i+=100){
        const ch=up.slice(i,i+100),r=await sbc.rpc('put_records',{p_shop:cl.shop,p_kind:kind,p_rows:ch.map(x=>({rid:x.rid,data:x.data}))});
        if(r.error)throw r.error;ch.forEach(x=>{sn[x.rid]=x.c})}
      for(let i=0;i<del.length;i+=200){
        const ch=del.slice(i,i+200),r=await sbc.rpc('delete_records',{p_shop:cl.shop,p_kind:kind,p_rids:ch});
        if(r.error)throw r.error;ch.forEach(id=>{delete sn[id]})}
    }
    if(mgr()){const sp=shopPayload(),c=cj(sp);if(c!==cl.snap.shop){const r=await sbc.from('shops').update(sp).eq('id',cl.shop);if(r.error)throw r.error;cl.snap.shop=c}}
    cl.dirty=false;pill('synced');offSave();
  }catch(e){
    if(isNet(e)){pill('offline');clearTimeout(cl.timer);cl.timer=setTimeout(cloudPush,5000)}
    else if(!retry&&/jwt|401|expired/i.test(errMsg(e))){try{await sbc.auth.refreshSession()}catch(x){}cl.busy=false;return cloudPush(true)}
    else{toast(errMsg(e),1);cl.dirty=false;try{await pullMeta();await pullRecords();pill('synced');softRender(true)}catch(x){pill('offline')}}
  }finally{cl.busy=false;if(cl.again){cl.again=false;cl.timer=setTimeout(cloudPush,300)}}
}

const gv=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function clErr(t){cl.vals={'cl-e':gv('cl-e'),'cl-sn':gv('cl-sn'),'cl-on':gv('cl-on'),'cl-sname':gv('cl-sname')};cl.err=t;cloudLogin()}
async function clBusy(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){clErr(nice(errMsg(e)))}finally{if(btn)btn.disabled=false}}

document.addEventListener('keydown',e=>{if(!CLOUD||e.key!=='Enter'||!e.target.closest||!e.target.closest('[data-clform]'))return;const b=document.querySelector('[data-clform] .go');if(b)b.click()});
document.addEventListener('click',e=>{
  if(!CLOUD)return;
  const b=e.target.closest&&e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.clMode){cl.vals={'cl-e':gv('cl-e')};cl.mode=d.clMode;cl.err='';if(d.clMode==='newshop')cl.needPw=false;cloudLogin();return}
  if(d.clShop){cl.err='';cloudTryOpen(d.clShop);return}

  if('clIn' in d){clBusy(b,async()=>{
    const em=gv('cl-e').toLowerCase(),pw=document.getElementById('cl-p').value;if(!em||!pw)return clErr('Enter your email and password.');
    const sh=!!(document.getElementById('cl-shared')||{}).checked;if(sh!==isShared()){try{localStorage.setItem('atoll_shared',sh?'1':'0')}catch(x){}sbc=mkClient(sh)}
    const r=await sbc.auth.signInWithPassword({email:em,password:pw});if(r.error)return clErr(nice(r.error.message));
    await cloudEnter(r.data.user)})}
  else if('clStaff' in d){clBusy(b,async()=>{
    const un=gv('cl-sname').toLowerCase().replace(/\s+/g,'').replace(/@/g,'.'),pw=document.getElementById('cl-p').value,k=un.lastIndexOf('.');
    if(k<1||!slugN(un.slice(0,k))||!slugN(un.slice(k+1))||!pw)return clErr('Enter your username (like 12399@icart) and your password.');
    const sh=!!(document.getElementById('cl-shared')||{}).checked;if(sh!==isShared()){try{localStorage.setItem('atoll_shared',sh?'1':'0')}catch(x){}sbc=mkClient(sh)}
    const r=await sbc.auth.signInWithPassword({email:staffEmail(un.slice(0,k),un.slice(k+1)),password:pw});if(r.error)return clErr(/invalid login/i.test(r.error.message)?'Wrong username or password.':nice(r.error.message));
    await cloudEnter(r.data.user)})}
  else if('clGoogle' in d){clBusy(b,async()=>{const r=await sbc.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});if(r.error)clErr(r.error.message)})}
  else if('clUp' in d){clBusy(b,async()=>{
    const sn=gv('cl-sn'),on=gv('cl-on'),em=gv('cl-e').toLowerCase(),pw=document.getElementById('cl-p').value;
    if(!sn||!on)return clErr('Enter your shop name and your name.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return clErr('Enter a valid email address.');
    if(pw.length<8)return clErr('The password needs at least 8 characters.');
    try{localStorage.setItem('atoll_pending',JSON.stringify({shop:sn,owner:on,email:em}))}catch(x){}
    const r=await sbc.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin}});
    if(r.error)return clErr(nice(r.error.message));
    if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length){cl.mode='check';cl.err='';cloudLogin();return}
    if(r.data.session)await cloudEnter(r.data.user);else{cl.mode='check';cl.err='';cloudLogin()}})}
  else if('clNewshop' in d){clBusy(b,async()=>{
    const sn=gv('cl-sn'),on=gv('cl-on');
    if(!sn||!on)return clErr('Enter your shop name and your name.');
    if(cl.needPw){const pw=document.getElementById('cl-p').value;if(pw.length<8)return clErr('The password needs at least 8 characters.');
      const u=await sbc.auth.updateUser({password:pw});if(u.error)return clErr(u.error.message)}
    const id=await cloudCreateShop({shop:sn,owner:on});await cloudTryOpen(id)})}
  else if('clForgot' in d){clBusy(b,async()=>{
    const em=gv('cl-e').toLowerCase();if(!em)return clErr('Enter your email.');
    const r=await sbc.auth.resetPasswordForEmail(em,{redirectTo:location.origin});if(r.error)return clErr(r.error.message);
    cl.mode='check';cloudLogin()})}
  else if('clNewpw' in d){clBusy(b,async()=>{
    const pw=document.getElementById('cl-p').value;if(pw.length<8)return clErr('The password needs at least 8 characters.');
    const r=await sbc.auth.updateUser({password:pw});if(r.error)return clErr(r.error.message);
    history.replaceState(null,'',location.pathname);cl.mode='in';const s=await sbc.auth.getSession();if(s.data.session)await cloudEnter(s.data.session.user);else cloudLogin()})}
});

async function saveText(text,name,mime){
  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data:text});return}
    const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  catch(e){if(!e||e.code!=='declined')toast('Could not save the file.',1)}
}

function adCsv(txt){const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=c}row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}

async function offPrePush(){
  if(isShared())return;
  const c=await idbGet('shop_'+cl.shop);if(!c||c.uid!==cl.uid||!c.dirty||!c.S)return;
  S=Object.assign(blankS(),c.S);cl.snap=c.snap||{};cl.lastSync=c.lastSync||'';
  me=S.users.find(u=>u.uid===cl.uid)||null;if(!me)return;
  cl.dirty=true;await cloudPush();
  if(cl.dirty)throw new Error('Failed to fetch');
}
async function offTryOnline(){
  if(!cl.offline||cl.offBusy)return;cl.offBusy=true;
  try{
    const r=await sbc.auth.getSession();
    if(!r.data||!r.data.session){
      const t=await fetch(CFG.supabaseUrl+'/auth/v1/health',{cache:'no-store'}).catch(()=>null);
      if(t)await cloudOut('Please sign in again.');
      return;
    }
    const p=await sbc.rpc('am_i_admin');
    if(p.error){if(!isNet(p.error))await cloudOut('Please sign in again.');return}
    if(cl.dirty){cl.dirty=true;await cloudPush();if(cl.dirty)return}
    await pullMeta();
    if(!me){await cloudOut('Your access to this shop was removed.');return}
    if(S.status!=='active'){await cloudOut('This shop subscription is suspended. Please contact support.');return}
    await pullRecords();
    clearInterval(cl.offT2);cl.offline=false;cloudSubscribe();pill('synced');softRender(true);offSave();
    toast('Back online. Everything is saved.');
  }catch(e){}finally{cl.offBusy=false}
}
addEventListener('online',()=>{if(CLOUD&&cl.offline)offTryOnline()});

function invModel(i,O){

async function quotPdf(q){

  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data:buf});return}
    const u=URL.createObjectURL(new Blob([buf],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){if(!e||e.code!=='declined')toast('Could not save the PDF.',1)}

let cuLast='';

  if(navigator.webdriver||(matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches))return;
  const key=tab+'|'+(typeof rt!=='undefined'?rt:'');if(key===cuLast)return;cuLast=key;

    if(el.children.length)return;const t=el.textContent,m=t.match(/\d[\d,]*(\.\d+)?/);if(!m)return;
    const end=parseFloat(m[0].replace(/,/g,'')),dec=(m[1]||'').length-(m[1]?1:0);if(!(end>0))return;
    const t0=performance.now(),D=650,pre=t.slice(0,m.index),post=t.slice(m.index+m[0].length);
    const step=n=>{const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3),v=end*e;
      el.textContent=pre+v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+post;
      if(k<1)requestAnimationFrame(step);else el.textContent=t};
    requestAnimationFrame(step)});
}

    const st=e.__dva&&e.__dva[a];
    if(st&&v===st.t){if(LANG==='dv')continue;e.setAttribute(a,st.o);delete e.__dva[a];continue}
    if(LANG!=='dv'||dvSkip(e))continue;
    const r=dvT(v);if(r!=null&&r!==v){(e.__dva=e.__dva||{})[a]={o:v,t:r};e.setAttribute(a,r)}}
}
function dvWalk(root){
  if(!root)return;
  if(root.nodeType===3){dvNode(root);return}
  if(root.nodeType!==1&&root.nodeType!==11)return;
  if(root.nodeType===1){if(/^(SCRIPT|STYLE)$/.test(root.tagName))return;dvEl(root)}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(n.nodeType===3)dvNode(n);else if(!/^(SCRIPT|STYLE)$/.test(n.tagName))dvEl(n)}
}
let dvObs=null,dvBusy=false,dvTouched=false;
function dvSet(l){
  LANG=l==='dv'?'dv':'en';if(LANG==='dv')dvTouched=true;
  try{localStorage.setItem('atoll_lang',LANG)}catch(e){}
  const h=document.documentElement;h.lang=LANG==='dv'?'dv':'en';h.dir=LANG==='dv'?'rtl':'ltr';h.classList.toggle('lgdv',LANG==='dv');
  dvAll();if(LANG!=='dv')dvTouched=false;
}
function dvAll(){
  dvBusy=true;try{dvWalk(document.body);document.title=LANG==='dv'?(dvT('Atoll POS')||'Atoll POS'):'Atoll POS'}finally{dvBusy=false}
  dvPill();
}
function dvPill(){
  const lb=document.querySelector('.lgb');if(lb){lb.setAttribute('data-lang',LANG==='dv'?'en':'dv');const t=LANG==='dv'?'EN':'\u078B\u07A8';if(lb.textContent!==t)lb.textContent=t}
  const old=document.getElementById('lgpill');
  const loginScreen=!(typeof me!=='undefined'&&me)&&!!document.getElementById('app')&&!document.getElementById('nav')?.offsetParent;
  if(!loginScreen){if(old)old.remove();return}
  const lab=LANG==='dv'?'English':'ދިވެހި';
  if(old){if(old.textContent!==lab)old.textContent=lab;return}
  const b=document.createElement('button');b.id='lgpill';b.className='ghost';b.setAttribute('data-nt','');b.setAttribute('data-lang',LANG==='dv'?'en':'dv');b.textContent=lab;document.body.appendChild(b);
}
(function(){
  const start=()=>{
    dvObs=new MutationObserver(ms=>{
      if(dvBusy)return;if(LANG!=='dv'&&!dvTouched){dvPill();return}dvBusy=true;
      try{
        for(const m of ms){
          if(m.type==='childList'){m.addedNodes.forEach(n=>dvWalk(n))}
          else if(m.type==='characterData'){dvNode(m.target)}
          else if(m.type==='attributes'){dvEl(m.target)}
        }
        dvPill();
      }finally{dvBusy=false}
    });
    dvObs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:DVA});
    dvSet(LANG);
  };
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
/* the switch: login pill, Settings, and the top bar */
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-lang]');if(!b)return;
  e.stopImmediatePropagation();e.preventDefault();dvSet(b.getAttribute('data-lang'));
},true);
(function(){const _t=setTop;setTop=function(){_t.apply(this,arguments);try{
  if(!me)return;const ta=document.querySelector('#tb .ta');if(ta&&!ta.querySelector('[data-lang]'))
    ta.insertAdjacentHTML('afterbegin',`<button class='ib lgb' data-nt data-lang='${LANG==='dv'?'en':'dv'}' title='Language'>${LANG==='dv'?'EN':'ދި'}</button>`)}catch(e){}}})();

if(CLOUD)cloudBoot();else render();
</script>
