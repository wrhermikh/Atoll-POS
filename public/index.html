function findCode(c){

  const eq=x=>x&&String(x).toLowerCase()===c;
  for(const p of S.products){
    const vs=p.variants||[];
    for(let vi=0;vi<vs.length;vi++){const v=vs[vi],ss=v.subs||[];
      for(let si=0;si<ss.length;si++)if(eq(ss[si].barcode)||eq(ss[si].sku))return{p,vi,si};
      if(eq(v.barcode)||eq(v.sku))return{p,vi}}
    if(eq(p.barcode)||eq(p.sku))return{p};const ks=p.packs||[];for(let pi=0;pi<ks.length;pi++)if(eq(ks[pi].barcode)||eq(ks[pi].sku))return{p,pi}}
  return null;
}

async function pullRecords(){
  const rows=[];let from=0;
  for(;;){
    const r=await sbc.from('records').select('kind,rid,data,updated_at').eq('shop_id',cl.shop).order('kind').order('rid').range(from,from+999);
    if(r.error)throw r.error;rows.push(...r.data);if(r.data.length<1000)break;from+=1000;
  }
  const by={};rows.forEach(r=>{(by[r.kind]=by[r.kind]||[]).push(r);if(r.updated_at>cl.lastSync)cl.lastSync=r.updated_at});
  Object.keys(KINDS).forEach(k=>{
    const K=KINDS[k],arr=(by[k]||[]).map(r=>r.data).sort(K.sort);K.set(arr);
    const sn=cl.snap[k]={};arr.forEach(r=>{sn[K.id(r)]=cj(r)});
  });
}

async function pullDelta(){
  if(!cl.shop||!me||cl.busy||cl.dirty)return;
  try{
    const r=await sbc.from('records').select('kind,rid,data,updated_at').eq('shop_id',cl.shop).gte('updated_at',cl.lastSync||'1970-01-01').order('updated_at').limit(1000);
    if(r.error)return;let ch=false;
    r.data.forEach(x=>{if(applyRec(x.kind,x.rid,x.data,false))ch=true;if(x.updated_at>cl.lastSync)cl.lastSync=x.updated_at});
    if(ch)softRender();
  }catch(e){}
}
function applyRec(kind,rid,data,del){
  const K=KINDS[kind];if(!K)return false;
  const sn=cl.snap[kind]||(cl.snap[kind]={});
  if(!del&&sn[rid]===cj(data))return false;
  const arr=K.get().slice(),i=arr.findIndex(r=>K.id(r)===rid);
  if(del){if(i<0)return false;arr.splice(i,1);delete sn[rid]}
  else{if(i>=0)arr[i]=data;else arr.push(data);sn[rid]=cj(data)}
  arr.sort(K.sort);K.set(arr);return true;
}

/* ---------- saving data ---------- */
async function cloudPush(retry){
  if(!cl.shop||!me)return;
  if(cl.busy){cl.again=true;return}
  cl.busy=true;pill('saving');
  try{
    for(const kind of Object.keys(KINDS)){
      const K=KINDS[kind],cur=new Map();K.get().forEach(r=>cur.set(K.id(r),r));
      const sn=cl.snap[kind]||(cl.snap[kind]={}),up=[],del=[];
      cur.forEach((r,id)=>{const c=cj(r);if(sn[id]!==c)up.push({rid:id,data:r,c})});
      if(kind!=='log')Object.keys(sn).forEach(id=>{if(!cur.has(id))del.push(id)});
      for(let i=0;i<up.length;i+=100){
        const ch=up.slice(i,i+100),r=await sbc.rpc('put_records',{p_shop:cl.shop,p_kind:kind,p_rows:ch.map(x=>({rid:x.rid,data:x.data}))});
        if(r.error)throw r.error;ch.forEach(x=>{sn[x.rid]=x.c})}
      for(let i=0;i<del.length;i+=200){
        const ch=del.slice(i,i+200),r=await sbc.rpc('delete_records',{p_shop:cl.shop,p_kind:kind,p_rids:ch});
        if(r.error)throw r.error;ch.forEach(id=>{delete sn[id]})}
    }
    if(mgr()){const sp=shopPayload(),c=cj(sp);if(c!==cl.snap.shop){const r=await sbc.from('shops').update(sp).eq('id',cl.shop);if(r.error)throw r.error;cl.snap.shop=c}}
    cl.dirty=false;pill('synced');offSave();
  }catch(e){
    if(isNet(e)){pill('offline');clearTimeout(cl.timer);cl.timer=setTimeout(cloudPush,5000)}
    else if(!retry&&/jwt|401|expired/i.test(errMsg(e))){try{await sbc.auth.refreshSession()}catch(x){}cl.busy=false;return cloudPush(true)}
    else{toast(errMsg(e),1);cl.dirty=false;try{await pullMeta();await pullRecords();pill('synced');softRender(true)}catch(x){pill('offline')}}
  }finally{cl.busy=false;if(cl.again){cl.again=false;cl.timer=setTimeout(cloudPush,300)}}
}

document.addEventListener('click',e=>{

    const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);

  const L=[S.shop||'Shop'];if(O.addr)String(S.addr||'').split(/\n/).map(s=>s.trim()).filter(Boolean).forEach(s=>L.push(s));
  if(O.phone&&S.phone)L.push('Tel: '+S.phone);if(on&&O.tin&&S.tin)L.push('GST TIN: '+S.tin);return L;
}
function custInfo(name,phone,cid){
  const c=S.customers.find(x=>(cid&&x.id==cid)||x.name===name)||{};
  return {name:name||'',phone:phone||c.phone||'',addr:c.addr||''};
}
function invModel(i,O){
  O=O||dopt('inv');const on=i.tax!==false,pays=i.pays||[],t=[];
  if(i.disc){t.push(['Subtotal',fm(i.sub)]);t.push(['Discount'+(i.reason?' ('+i.reason+')':''),'-'+fm(i.disc)])}
  if(on){t.push(['Untaxed Amount',fm(i.total-i.gst)]);t.push(['GST '+i.rate+'%',fm(i.gst)])}
  t.push(['Total',fm(i.total),'t']);
  if(O.paid)pays.forEach(p=>t.push(['Paid on '+dDate(i.at)+' using '+p.m,fm(p.a),'i']));
  t.push(['Amount Due',fm(Math.max(0,i.due||0)),'d']);
  const b=rcBal(i);if(b)t.push(['Customer balance owing',fm(b)]);
  const meta=[];if(O.mDate)meta.push(['Invoice Date',dDate(i.at)]);if(O.mPay)meta.push(['Payment',pays.map(p=>p.m).join(', ')||'-']);if(O.mSales&&i.by&&S.rcCashier!==false)meta.push(['Salesperson',i.by]);
  return {kind:'inv',on,tc:on&&!!O.taxCol,title:(O.title||(on?'Tax Invoice':'Invoice'))+' '+i.no,no:i.no,shop:docShop(on,O),cust:custInfo(i.cust==='Walk-in'?'Walk-in customer':i.cust,'',i.cid),meta,
    items:i.items.map(l=>({n:l.name,q:l.unit==='kg'?String(+(+l.qty).toFixed(3))+' kg':String(l.qty),p:(+l.price).toFixed(2)+(l.unit==='kg'?'/kg':''),t:on?(l.tx?'':i.rate+'%'):'',a:fm(l.qty*l.price)})),
    tot:t,pay:O.bank&&S.bank?{no:i.no,bank:S.bank}:null,terms:O.terms?(S.terms||''):'',qr:O.qr?(S.payqr||''):''};
}
function quotModel(q,O){
  O=O||dopt('quo');const on=q.tax!==false,c=qCalc(q.items,q.disc,on),t=[],rate=q.rate!=null?q.rate:S.gst;
  if(c.d){t.push(['Subtotal',fm(c.sub)]);t.push(['Discount','-'+fm(c.d)])}
  if(on){t.push(['Untaxed Amount',fm(c.t-c.gst)]);t.push(['GST '+rate+'%',fm(c.gst)])}
  t.push(['Total',fm(c.t),'t']);
  const meta=[];if(O.mDate)meta.push(['Quotation Date',dDate(q.at)]);if(O.mExp&&q.valid)meta.push(['Expiration',dDate(q.valid)]);if(O.mSales&&q.by&&S.rcCashier!==false)meta.push(['Salesperson',q.by]);
  return {kind:'quo',on,tc:on&&!!O.taxCol,title:(O.title||'Quotation')+' '+qn(q),no:qn(q),shop:docShop(on,O),cust:custInfo(q.cust,q.cphone),meta,
    items:q.items.map(l=>({n:l.name,q:l.unit==='kg'?String(+(+l.qty).toFixed(3))+' kg':String(l.qty),p:(+l.price).toFixed(2)+(l.unit==='kg'?'/kg':''),t:on?(l.tx?'':rate+'%'):'',a:fm(lt(l))})),
    tot:t,pay:null,terms:O.terms?(q.notes||''):'',qr:''};
}
function docHtml(D,O){
  O=O||dopt(D.kind);const cl=D.cust,
  cLines=[cl.name].concat(cl.addr?String(cl.addr).split(/\n/):[]).filter(Boolean).map(esc).join('<br>')+(cl.phone?'<br>☎ '+esc(cl.phone):'');
  const cust=`<div class='dvcu ${O.custPos==='left'?'L':'R'}'>${D.kind==='quo'?'<b>Invoicing Address</b><br>':''}${cLines}</div>`;

  return `<div class='dv s-${O.shade}' style="--ac:${O.acc};font-family:${FONTS[O.font].css}"><div class='dvh lp-${O.logoPos}'>${S.logo?`<div class='dvl'><img src='${S.logo}' alt='' style='max-width:${lw}px;max-height:${Math.round(lw*.55)}px'></div>`:''}<div class='dvc'>${D.shop.map(esc).join('<br>')}</div></div>${cust}
  <h1 class='dvt1'>${esc(D.title)}</h1><div class='dvm'>${D.meta.map(m=>`<div><span>${esc(m[0])}</span>${esc(m[1])}</div>`).join('')}</div>
  <table class='dvt'><tr><th>Description</th><th>Quantity</th><th>Unit Price</th>${D.tc?'<th>Taxes</th>':''}<th>Amount</th></tr>${D.items.map(l=>`<tr><td>${esc(l.n)}</td><td>${esc(l.q)}</td><td>${esc(l.p)}</td>${D.tc?`<td>${esc(l.t||'')}</td>`:''}<td>${esc(l.a)}</td></tr>`).join('')}</table>
  <div class='dvb'><div class='dvp'>${D.pay?`Payment Communication: <b>${esc(D.pay.no)}</b><br>on this account: <b style='white-space:pre-wrap'>${esc(D.pay.bank)}</b>`:''}${D.qr?`<div style='margin-top:10px'><img src='${D.qr}' style='width:96px;height:96px' alt=''><div style='font-size:11px'>Scan to pay</div></div>`:''}</div>
  <div class='dvx'>${D.tot.map(r=>`<div class='dvk ${r[2]||''}'><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}</div></div>
  ${D.terms?`<div class='dvn'><b>${D.kind==='quo'?'Notes and terms':'Terms and conditions'}</b><br>${esc(D.terms)}</div>`:''}
  <div class='dvf'>${foot}${O.foot2?`<div class='dvg'>${esc(O.foot2)}</div>`:''}${D.kind==='quo'?'<div class="dvg">This is a quotation, not a tax receipt.</div>':''}</div></div>`;

function invDoc(i){return docHtml(invModel(i),dopt('inv'))}
function quotDoc(q){return docHtml(quotModel(q),dopt('quo'))}

function docPdfDraw(doc,D,fmt){
  const O=dopt(D.kind),FP=FONTS[O.font].pdf,AC=hex2(O.acc),LT=AC.map(c=>Math.round(c+(255-c)*.45));
  const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight(),a5=fmt==='a5',M=a5?10:16,R=pw-M,W=R-M,k=a5?.86:1;
  const T=(t,x,yy,o)=>doc.text(pdfTxt(String(t)),x,yy,o);let y=M+2;
  const txt=(c)=>doc.setTextColor.apply(doc,c||[20,24,32]),F=(s)=>doc.setFont(FP,s||'normal');
  const bg=(x,yy,w,h)=>{if(O.shade==='shaded'){doc.setFillColor(243,244,246);doc.rect(x,yy,w,h,'F')}else if(O.shade==='lines'){doc.setDrawColor(215);doc.setLineWidth(.2);doc.line(x,yy+h,x+w,yy+h)}};
  // header: logo and shop details
  let hy=y,lh=0,lw=0;const sz=O.logoSize==='s'?.6:O.logoSize==='l'?1.35:1,base=(a5?30:40)*sz;
  if(S.logo&&S.logoR){lw=base;lh=Math.min(30,lw*S.logoR);if(lh<lw*S.logoR)lw=lh/S.logoR}
  F();doc.setFontSize(10*k);txt();const n=D.shop.length;
  if(O.logoPos==='center'){let ly=hy;if(lw){try{doc.addImage(S.logo,imgFmt(S.logo),(pw-lw)/2,hy,lw,lh)}catch(e){}ly=hy+lh+3}
    D.shop.forEach((s,i)=>{if(i===0)doc.setFont(FP,'bold');else F();T(s,pw/2,ly+4+i*5*k,{align:'center'})});F();y=ly+4+n*5*k+(a5?4:6)}
  else{const lx=O.logoPos==='right'?R-lw:M,sx=O.logoPos==='right'||!lw?M:M+lw+(a5?6:8);
    if(lw){try{doc.addImage(S.logo,imgFmt(S.logo),lx,hy,lw,lh)}catch(e){}}
    D.shop.forEach((s,i)=>{if(i===0)doc.setFont(FP,'bold');else F();T(s,sx,hy+4+i*5*k)});F();y=Math.max(hy+lh,hy+4+n*5*k)+(a5?6:10)}
  // customer block
  doc.setFontSize(10*k);
  const cl=[D.cust.name].concat(D.cust.addr?String(D.cust.addr).split(/\n/):[]).filter(Boolean).map(s=>pdfTxt(s));if(D.cust.phone)cl.push('Tel: '+D.cust.phone);
  const cx=O.custPos==='left'?M:M+W*.575;let cy=y;
  if(D.kind==='quo'){doc.setFont(FP,'bold');T('Invoicing Address',cx,cy);F();cy+=5.5}
  cl.forEach((s,i)=>T(s,cx,cy+i*5*k));y=cy+Math.max(1,cl.length)*5*k+4;
  // title
  F();doc.setFontSize(19*k);txt(AC);T(D.title,M,y+6);y+=14;
  // meta
  const mw=W/4;D.meta.forEach((m,i)=>{doc.setFont(FP,'bold');doc.setFontSize(9*k);txt(LT);T(m[0],M+i*mw,y);F();doc.setFontSize(10*k);txt();T(m[1],M+i*mw,y+5.2)});if(D.meta.length)y+=14;else y+=2;
  // items
  const cols=D.tc?[M+W*.625,M+W*.763,M+W*.849,R]:[M+W*.70,M+W*.85,0,R],descW=cols[0]-M-26;
  const head=()=>{F();doc.setFontSize(9.5*k);txt();T('Description',M+2,y);T('Quantity',cols[0],y,{align:'right'});T('Unit Price',cols[1],y,{align:'right'});if(D.tc)T('Taxes',cols[2],y,{align:'right'});T('Amount',cols[3]-2,y,{align:'right'});
    doc.setDrawColor(120);doc.setLineWidth(.3);doc.line(M,y+2.4,R,y+2.4);y+=4.5};
  head();
  D.items.forEach(l=>{const w=doc.splitTextToSize(pdfTxt(l.n),descW),h=Math.max(1,w.length)*4.6*k+4.2;
    if(y+h>ph-(D.pay||D.terms?70:55)){doc.addPage();y=M+6;head()}
    bg(M,y,W,h-.6);doc.setFontSize(9.5*k);F();txt();
    w.forEach((s,i)=>T(s,M+2,y+4.6+i*4.6*k));T(l.q,cols[0],y+4.6,{align:'right'});T(l.p,cols[1],y+4.6,{align:'right'});if(D.tc)T(l.t||'',cols[2],y+4.6,{align:'right'});T(l.a,cols[3]-2,y+4.6,{align:'right'});y+=h});
  y+=8;
  // totals box (right) and payment details (left)
  const bx=M+W*.55,bw=R-bx;
  const rowsL=D.tot.map(r=>{const kind=r[2]||'';doc.setFont(FP,kind==='t'||kind==='d'?'bold':kind==='i'?'italic':'normal');doc.setFontSize((kind==='i'?8.5:9.5)*k);return doc.splitTextToSize(pdfTxt(r[0]),bw-(a5?27:32))});
  const need=rowsL.reduce((s,l)=>s+Math.max(1,l.length)*4.4*k+3,0);
  if(y+need+6>ph-30){doc.addPage();y=M+6}
  let ty=y;D.tot.forEach((r,i)=>{const kind=r[2]||'',L=rowsL[i],h=Math.max(1,L.length)*4.4*k+3;bg(bx,ty,bw,h-.5);
    doc.setFont(FP,kind==='t'||kind==='d'?'bold':kind==='i'?'italic':'normal');doc.setFontSize((kind==='i'?8.5:9.5)*k);txt(kind==='t'?AC:null);
    L.forEach((s,j)=>T(s,bx+3,ty+4.2*k+j*4.4*k));T(r[1],R-3,ty+4.2*k,{align:'right'});ty+=h});
  let ly=y;F();doc.setFontSize(9.5*k);txt();
  if(D.pay){doc.splitTextToSize('Payment Communication: '+D.pay.no,bx-M-6).forEach(s=>{T(s,M+2,ly+4);ly+=4.8});T('on this account:',M+2,ly+4);ly+=4.8;doc.setFont(FP,'bold');String(D.pay.bank).split(/\n/).forEach(bl=>doc.splitTextToSize(pdfTxt(bl),bx-M-6).forEach(s=>{doc.text(s,M+2,ly+4);ly+=4.8}));F()}
  if(D.qr){try{doc.addImage(D.qr,imgFmt(D.qr),M+2,ly+3,24,24);doc.setFontSize(8);T('Scan to pay',M+14,ly+30,{align:'center'});ly+=32}catch(e){}}
  y=Math.max(ty,ly)+6;
  if(D.terms){doc.setFont(FP,'bold');doc.setFontSize(9*k);txt();if(y>ph-34){doc.addPage();y=M+6}T(D.kind==='quo'?'Notes and terms':'Terms and conditions',M+2,y);y+=5;F();
    String(D.terms).split(/\n/).forEach(tl=>doc.splitTextToSize(pdfTxt(tl),W-4).forEach(s=>{if(y>ph-26){doc.addPage();y=M+6}doc.text(s,M+2,y);y+=4.4}))}
  // footer (always at the bottom) and page numbers on every page
  const np=doc.getNumberOfPages(),foot=[O.fphone&&S.phone,O.ffoot&&S.footer].filter(Boolean).join('   |   ');
  for(let p=1;p<=np;p++){doc.setPage(p);doc.setDrawColor(40);doc.setLineWidth(.3);doc.line(M,ph-20,R,ph-20);txt();F();doc.setFontSize(9);let fy=ph-15.5;
    if(foot){T(foot,pw/2,fy,{align:'center'});fy+=4}
    doc.setFontSize(8);if(O.foot2){T(O.foot2,pw/2,fy,{align:'center'});fy+=3.6}
    if(D.kind==='quo'){T('This is a quotation, not a tax receipt.',pw/2,fy,{align:'center'});fy+=3.6}
    if(O.page){doc.setFontSize(9);txt([130,130,130]);T('Page '+p+' / '+np,pw/2,ph-5,{align:'center'})}}
  txt();
}
async function quotPdf(q){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('PDF tools did not load. Check your connection and try again.',1);return}
  const doc=new J({unit:'mm',format:'a4',orientation:'portrait'});docPdfDraw(doc,quotModel(q),'a4');
  const buf=doc.output('arraybuffer'),name='Quotation-'+qn(q)+'.pdf';
  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data:buf});return}
    const u=URL.createObjectURL(new Blob([buf],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){if(!e||e.code!=='declined')toast('Could not save the PDF.',1)}
}

/* ================= Document designer (owners and managers) ================= */
let dsk='inv';
const SWATCH=['#0a7a8f','#2f5bea','#16a34a','#d64545','#c2410c','#7c3aed','#1b2433','#be185d'];
const DSN=[
 ['Look',[['acc','Accent colour','color'],['font','Font style','sel',Object.keys(FONTS).map(k=>[k,FONTS[k].n])],['shade','Table and totals style','sel',[['shaded','Shaded rows'],['lines','Lines only'],['plain','Plain']]]]],
 ['Header',[['logoPos','Logo position','sel',[['left','Left'],['center','Centre'],['right','Right']]],['logoSize','Logo size','sel',[['s','Small'],['m','Medium'],['l','Large']]],['addr','Show shop address','bool'],['phone','Show shop phone','bool'],['tin','Show GST TIN (GST shops)','bool'],['custPos','Customer details','sel',[['right','On the right'],['left','On the left']]],['title','Document title (leave empty for the default)','text']]],
 ['Details row',[['mDate','Date','bool'],['mExp','Expiration date','bool','quo'],['mPay','Payment method','bool','inv'],['mSales','Salesperson','bool']]],
 ['Table and totals',[['taxCol','Show the Taxes column (GST shops)','bool'],['paid','Show payments received','bool','inv']]],
 ['Extras and footer',[['bank','Bank details (Settings, Receipt options)','bool','inv'],['qr','Payment QR code','bool','inv'],['terms','Terms and conditions','bool'],['fphone','Phone number in footer','bool'],['ffoot','Footer message in footer','bool'],['foot2','Extra footer line (website, email, social)','text'],['page','Page numbers','bool']]]
];
function dsnSampleObj(k){
  const on=gstOn(),r=on?S.gst:0,items=[{id:1,name:'Sample item',qty:2,price:25,cost:1,tx:''},{id:2,name:'Another item',qty:1,price:40,cost:1,tx:''}],gst=on?90*r/(100+r):0;
  return k==='inv'?{no:'INV-1001',at:Date.now(),by:me.name,cust:'Sample customer',cid:0,items,sub:90,disc:0,total:90,gst,rate:r,tax:on,pays:[{m:'Cash',a:90}],due:0}
   :{no:'1001',at:Date.now(),by:me.name,cust:'Sample customer',cphone:'7771234',items,disc:0,notes:S.terms||'Prices are valid until the expiration date.',valid:Date.now()+14*864e5,tax:on,rate:r};
}
function dsnPrev(){
  const pg=document.getElementById('dsnpg'),box=document.getElementById('dsnbox');if(!pg||!box)return;
  const o=dsnSampleObj(dsk);pg.innerHTML=dsk==='inv'?invDoc(o):quotDoc(o);
  const z=Math.min(1,(box.clientWidth-2)/794);pg.style.zoom=z;
}
function dsnField(f,O){
  const [k,l,t,opts]=f,only=t==='sel'?f[4]:f[3];if(only&&only!==dsk)return '';
  if(t==='bool')return `<label class='chk' style='border:0;padding:6px 0'><input type='checkbox' data-do='${k}' ${O[k]?'checked':''}>${esc(l)}</label>`;
  if(t==='sel')return `<div style='margin:8px 0'><span class='fl'>${esc(l)}</span><select data-do='${k}'>${opts.map(o=>`<option value='${o[0]}' ${O[k]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  if(t==='text')return `<div style='margin:8px 0'><span class='fl'>${esc(l)}</span><input data-do='${k}' value='${esc(O[k]||'')}' maxlength='60'></div>`;
  return `<div style='margin:8px 0'><span class='fl'>${esc(l)}</span><div style='display:flex;gap:8px;flex-wrap:wrap;align-items:center'>${SWATCH.map(c=>`<button class='ib' data-dcol='${c}' style='background:${c};width:34px;height:34px;border-radius:50%;border:${O.acc.toLowerCase()===c?'3px solid var(--ink)':'2px solid var(--ln)'}' aria-label='${c}'></button>`).join('')}<input type='color' data-do='acc' value='${O.acc}' style='width:44px;height:36px;padding:2px' aria-label='Custom colour'></div></div>`;
}
function dsnPage(){
  setTop('Document layout','data-dsback');
  const O=dopt(dsk);
  $('#app').innerHTML=`<p class='sub'>Design how your invoices and quotations look. The standard layout is the starting point; change anything you like. Changes apply to printing and PDFs, and are shared with everyone in the shop.</p>
  <div style='display:flex;gap:8px;margin-bottom:12px'><button class='${dsk==='inv'?'p':'ghost'}' data-dsk='inv'>Invoice</button><button class='${dsk==='quo'?'p':'ghost'}' data-dsk='quo'>Quotation</button></div>
  <div class='dsn'><div class='dsnc'>${DSN.map(s=>`<div class='card'><div class='hd'>${s[0]}</div>${s[1].map(f=>dsnField(f,O)).join('')}</div>`).join('')}<div class='two'><button data-dpdf>Download a sample PDF</button><button class='ghost danger' data-dreset>Reset to the standard layout</button></div></div>
  <div class='dsnv'><div class='hd' style='margin:0 0 8px'>Preview</div><div id='dsnbox' class='dsnbox'><div id='dsnpg' class='dsnpg'></div></div></div></div>`;
  dsnPrev();
}
function dsnSet(k,v){S.doc=S.doc||{};S.doc[dsk]=Object.assign({},S.doc[dsk],{[k]:v});save()}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('button');if(!b||!b.dataset)return;const d=b.dataset,stop=()=>{e.stopImmediatePropagation();e.preventDefault()};
  if('dsn' in d){stop();tab='dsn';render();return}
  if('dsback' in d){stop();tab='set';render();return}
  if(d.dsk){stop();dsk=d.dsk;dsnPage();return}
  if(d.dcol){stop();dsnSet('acc',d.dcol);dsnPage();return}
  if('dreset' in d){stop();if(S.doc)delete S.doc[dsk];save();dsnPage();toast('Back to the standard layout');return}
  if('dpdf' in d){stop();const o=dsnSampleObj(dsk);if(dsk==='inv')savePdf(o,S.pfmt==='a5'?'a5':'a4');else quotPdf(o);return}
},true);
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset||t.dataset.do===undefined||tab!=='dsn')return;if(t.type==='text'||t.type==='color'){dsnSet(t.dataset.do,t.value);dsnPrev()}},true);
document.addEventListener('change',e=>{const t=e.target;if(!t||!t.dataset||t.dataset.do===undefined||tab!=='dsn')return;
  if(t.type==='checkbox')dsnSet(t.dataset.do,t.checked?1:0);else{dsnSet(t.dataset.do,t.value);if(t.type==='color'){dsnPage();return}}dsnPrev()},true);
addEventListener('resize',()=>{if(tab==='dsn')dsnPrev()});

/* ================= Live clock ================= */
function clockText(){const d=new Date();return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'  '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function clockMount(){
  const tb=document.querySelector('.tb');if(!tb)return;
  let c=document.getElementById('clk');if(!c){c=document.createElement('div');c.id='clk';c.className='lclk';c.setAttribute('aria-label','Current time')}
  if(c.parentNode!==tb)tb.appendChild(c);c.textContent=clockText();
}
setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=clockText();else clockMount()},1000);
(function(){if(typeof setTop!=='function')return;const _s=setTop;setTop=function(){const r=_s.apply(this,arguments);clockMount();return r}})();

if(CLOUD)cloudBoot();else render();
</script>
